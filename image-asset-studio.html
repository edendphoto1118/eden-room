<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Asset Studio | EDEN ROOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Space+Mono:ital,wght@0,300;0,400;1,300&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                        zh: ['Shippori Mincho', 'serif']
                    },
                    colors: {
                        eden: {
                            black: '#020202',
                            gold: '#C5A059',
                            gray: '#1a1a1a',
                            text: '#888888'
                        }
                    },
                    animation: { 'fade-in': 'fadeIn 1s ease-out forwards' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020202;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .hairline { width: 1px; height: 40px; background: #222; margin: 0 auto 20px auto; }
        .studio-panel { background: #050505; border: 1px solid #151515; }
        .input-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em; color: #555; text-transform: uppercase; }
        .field {
            width: 100%; background: #090909; border: 1px solid #222; color: #fff;
            padding: 12px 14px; font-family: 'Shippori Mincho', serif; font-size: 13px;
            transition: border-color 0.25s, background-color 0.25s;
        }
        .field:focus { outline: none; border-color: #C5A059; background: #0f0f0f; }
        textarea.field { min-height: 110px; resize: vertical; line-height: 1.7; }
        .btn-gold { background: #C5A059; color: #020202; font-family: 'Space Mono', monospace; letter-spacing: 0.18em; }
        .btn-gold:hover { background: #d4b06a; }
        .ghost-btn { border: 1px solid #333; color: #777; font-family: 'Space Mono', monospace; letter-spacing: 0.15em; }
        .ghost-btn:hover { border-color: #C5A059; color: #C5A059; }
        .preview-frame { background: #030303; border: 1px dashed #333; min-height: 320px; }
        .preview-frame.has-image { border-style: solid; border-color: #333; }
        .asset-output { background: #070707; border: 1px solid #222; color: #c8c8c8; white-space: pre-wrap; }
        .footer-link { color: #666; transition: color 0.3s; }
        .footer-link:hover { color: #C5A059; }
    </style>
</head>
<body class="px-6 py-8 md:py-12">

    <header class="relative z-10 max-w-6xl mx-auto text-center mb-12 animate-fade-in">
        <a href="index.html" class="inline-block font-mono text-[10px] text-[#555] tracking-[0.3em] hover:text-[#C5A059] transition-colors mb-8">← EDEN ROOM</a>
        <div class="hairline"></div>
        <p class="font-mono text-[10px] text-[#444] tracking-[0.5em] uppercase mb-4">Asset Studio // Local Tool</p>
        <h1 class="font-serif text-4xl md:text-6xl text-white tracking-[0.18em] font-light">IMAGE ASSET STUDIO</h1>
        <p class="font-zh text-sm md:text-base text-[#777] leading-8 max-w-2xl mx-auto mt-6">
            將影像素材、品牌方向與生成需求整理成一份可複製的 visual brief。所有內容只在你的瀏覽器內處理，不會上傳。
        </p>
    </header>

    <main class="relative z-10 max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-5 gap-8 animate-fade-in" style="animation-delay: 0.1s;">
        <section class="studio-panel p-6 md:p-8 lg:col-span-2">
            <div class="mb-8">
                <span class="input-label">Source Image</span>
                <label id="dropZone" class="preview-frame mt-3 flex flex-col items-center justify-center text-center p-8 cursor-pointer hover:border-[#C5A059] transition-colors">
                    <input id="imageInput" type="file" accept="image/*" class="hidden">
                    <img id="imagePreview" class="hidden max-h-[360px] w-full object-contain" alt="Uploaded image preview">
                    <span id="uploadText" class="font-mono text-[10px] text-[#555] tracking-[0.25em] uppercase">Upload Reference Image</span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <label class="block col-span-2">
                    <span class="input-label">Asset Name</span>
                    <input id="assetName" class="field mt-2" value="EDEN visual asset">
                </label>

                <label class="block">
                    <span class="input-label">Use Case</span>
                    <select id="useCase" class="field mt-2">
                        <option>Instagram post</option>
                        <option>Portfolio cover</option>
                        <option>Brand moodboard</option>
                        <option>Commercial concept</option>
                        <option>Website visual</option>
                    </select>
                </label>

                <label class="block">
                    <span class="input-label">Ratio</span>
                    <select id="ratio" class="field mt-2">
                        <option>4:5 portrait</option>
                        <option>1:1 square</option>
                        <option>16:9 landscape</option>
                        <option>9:16 story</option>
                        <option>3:2 editorial</option>
                    </select>
                </label>

                <label class="block col-span-2">
                    <span class="input-label">Visual Direction</span>
                    <textarea id="visualDirection" class="field mt-2">quiet luxury, editorial photography, controlled contrast, black and gold atmosphere</textarea>
                </label>

                <label class="block col-span-2">
                    <span class="input-label">Material Notes</span>
                    <textarea id="materialNotes" class="field mt-2">skin texture, soft shadow, cinematic highlight, premium archive mood</textarea>
                </label>
            </div>

            <button id="generateBtn" class="btn-gold w-full py-4 mt-6 text-[10px] font-bold">GENERATE BRIEF</button>
        </section>

        <section class="studio-panel p-6 md:p-8 lg:col-span-3 flex flex-col">
            <div class="flex items-start justify-between gap-4 mb-6">
                <div>
                    <span class="input-label">Generated Visual Brief</span>
                    <h2 class="font-serif text-2xl text-white mt-2 tracking-widest">Asset Prompt</h2>
                </div>
                <button id="copyBtn" class="ghost-btn px-4 py-3 text-[9px]">COPY</button>
            </div>

            <pre id="output" class="asset-output flex-1 min-h-[420px] p-5 font-mono text-xs leading-7 overflow-auto">按下 GENERATE BRIEF 後，這裡會產生可複製的影像需求文字。</pre>
        </section>
    </main>

    <footer class="relative z-10 max-w-6xl mx-auto mt-20 text-center">
        <div class="hairline" style="height: 60px;"></div>
        <a href="https://www.instagram.com/eden_d_photo/" target="_blank" class="footer-link font-serif text-lg tracking-widest">INSTAGRAM</a>
        <p class="text-[9px] font-mono text-[#333] tracking-[0.3em] uppercase mt-8">&copy; 2026 EDEN ROOM.<br>Taipei City.</p>
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadText = document.getElementById('uploadText');
        const dropZone = document.getElementById('dropZone');
        const output = document.getElementById('output');

        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                imagePreview.src = reader.result;
                imagePreview.classList.remove('hidden');
                uploadText.classList.add('hidden');
                dropZone.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            const assetName = document.getElementById('assetName').value.trim() || 'Untitled asset';
            const useCase = document.getElementById('useCase').value;
            const ratio = document.getElementById('ratio').value;
            const visualDirection = document.getElementById('visualDirection').value.trim();
            const materialNotes = document.getElementById('materialNotes').value.trim();
            const hasReference = imageInput.files.length > 0 ? 'Yes, use the uploaded reference as the visual anchor.' : 'No uploaded image. Build from the written direction.';

            output.textContent = `IMAGE ASSET BRIEF\n\nAsset name: ${assetName}\nUse case: ${useCase}\nAspect ratio: ${ratio}\nReference image: ${hasReference}\n\nVisual direction:\n${visualDirection}\n\nMaterial and detail notes:\n${materialNotes}\n\nGeneration prompt:\nCreate a premium EDEN ROOM visual asset for ${useCase}. Use ${ratio}. The image should feel like quiet luxury editorial photography: controlled contrast, intentional negative space, refined texture, subtle black-and-gold atmosphere, and a cinematic archive mood. Preserve natural detail and avoid generic stock-photo styling.\n\nNegative direction:\nAvoid over-saturated colors, plastic skin, noisy typography, cluttered backgrounds, random logos, low-resolution artifacts, and overly commercial template aesthetics.`;
        });

        document.getElementById('copyBtn').addEventListener('click', async () => {
            await navigator.clipboard.writeText(output.textContent);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = 'COPIED';
            setTimeout(() => { copyBtn.textContent = 'COPY'; }, 1200);
        });
    </script>
</body>
</html>
